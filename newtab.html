<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vim-home</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<header id="hud-header">
  <span class="hud-label"><span class="hud-sys">SYS://</span>BOOKMARKS</span>
  <span class="hud-rule" aria-hidden="true"></span>
  <span id="hud-count" class="hud-count"></span>
</header>

<div id="app" tabindex="-1" role="listbox" aria-label="Bookmarks">
  <div id="search-bar" class="closed">
    <span class="prompt" aria-hidden="true">/</span>
    <span id="search-label" class="search-label" aria-hidden="true">SEARCH</span>
    <input id="search-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Filter bookmarks">
    <span id="search-count" aria-live="polite"></span>
    <span id="search-keys" class="search-keys" aria-hidden="true">o / search</span>
  </div>
  <div id="history-bar">
    <ol id="history-list" class="log-list hidden" aria-label="History matches"></ol>
    <div id="ticker" aria-hidden="true">
      <div class="ticker-track"></div>
    </div>
  </div>
  <div id="empty" class="hidden">
    <span class="sr-only" aria-live="polite">No matching bookmarks</span>
    <span id="empty-msg" aria-hidden="true"></span>
  </div>
  <div id="grid" class="grid"></div>

  <div id="toast" class="hidden" role="status"></div>

  <div id="statusline">
    <span class="status-left">
      <span id="mode" data-mode="normal" aria-hidden="true">NORMAL</span>
      <span id="sort-order" class="status-tag"></span>
      <span id="start-tag" class="status-tag"></span>
      <span id="history-tag" class="status-tag"></span>
      <span id="filter-tag" class="status-tag status-filter"></span>
      <span id="pending" class="status-pending" aria-hidden="true"></span>
    </span>
    <button id="hint" type="button" title="Show keyboard shortcuts"></button>
  </div>

  <div id="help-overlay" class="hidden">
    <div id="help-panel" role="dialog" aria-label="Keyboard shortcuts">
      <div class="panel-header" aria-hidden="true">
        <span><span class="hud-sys">SYS://</span>HELP</span><span class="hud-rule"></span><span>KEYMAP</span>
      </div>
      <h2>Keyboard shortcuts</h2>
      <div id="help-body"></div>
      <div class="panel-footer" aria-hidden="true">
        <span>vim-home</span><span>? / Esc to close</span>
      </div>
    </div>
  </div>
</div>

<section id="dashboard" aria-label="Dashboard">
  <div class="dash-panel dash-clock">
    <div class="dash-head" aria-hidden="true"><span><span class="hud-sys">SYS://</span>CLOCK</span><span class="hud-rule"></span><span id="clock-zone" class="dash-meta"></span></div>
    <div class="clock">
      <span id="clock-time">--:--</span><span id="clock-sec" class="clock-sec" aria-hidden="true">--</span>
    </div>
    <div id="clock-date" class="clock-date"></div>
    <div id="dash-summary" class="dash-summary"></div>
  </div>
  <div class="dash-panel">
    <div class="dash-head"><span><span class="hud-sys">LOG://</span>RECENT</span><span class="hud-rule" aria-hidden="true"></span><span class="dash-meta">LAST 5</span></div>
    <ol id="recent-list" class="log-list" aria-label="Recently opened"></ol>
  </div>
</section>

<div id="edit-overlay" class="overlay hidden">
  <form id="edit-panel" class="hud-panel" role="dialog" aria-modal="true" aria-labelledby="edit-heading" autocomplete="off" novalidate>
    <div class="panel-header" aria-hidden="true">
      <span><span class="hud-sys">SYS://</span><span id="edit-sys">EDIT</span></span><span class="hud-rule"></span><span>NODE</span>
    </div>
    <h2 id="edit-heading">Edit bookmark</h2>
    <label class="field">
      <span class="field-label">TITLE</span>
      <input id="edit-title" type="text" spellcheck="false" placeholder="(optional)">
    </label>
    <label class="field">
      <span class="field-label">URL</span>
      <input id="edit-url" type="text" spellcheck="false" autocapitalize="off" placeholder="https://">
    </label>
    <p id="edit-error" class="edit-error hidden" role="alert"></p>
    <div class="panel-footer" aria-hidden="true">
      <span>Enter save</span><span>Esc cancel</span>
    </div>
  </form>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
